<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0b0a">
  <title>Baby Shower Projector</title>
  <link rel="stylesheet" href="/projector.css">
</head>
<body>
  <main id="projector" class="projector">
    <div class="ambient" aria-hidden="true"></div>
    <section class="projector-content">
      <p class="eyebrow">Didi's Baby Shower</p>
      <h1 id="projector-title">Welcome ❤️</h1>
      <p id="projector-subtitle">Celebrations will appear here.</p>
    </section>
    <div id="projector-effect" class="projector-effect" aria-live="polite"></div>
    <div id="projector-status" class="projector-status">Connecting…</div>
  </main>
  <script type="module" src="/projector.js"></script>
</body>
</html>
