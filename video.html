<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="format-detection" content="telephone=no">
  <title>Family Video Call</title>
  <style>
    html, body, #video-root { margin: 0; width: 100%; height: 100%; background: #161215; }
    body { overflow: hidden; }
    #video-root { position: relative; }
    whereby-embed { display: block; width: 100%; height: 100%; }
    #boot-message {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #161215;
      color: white;
      font: 600 16px/1.4 system-ui, sans-serif;
      text-align: center;
    }
  </style>
  <script src="https://cdn.srv.whereby.com/embed/v2-embed.js" type="module"></script>
</head>
<body>
  <div id="video-root">
    <div id="boot-message">Preparing the family video call…</div>
  </div>
  <script type="module" src="/video-client.js"></script>
</body>
</html>
