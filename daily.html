<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="format-detection" content="telephone=no">
  <title>Family Video Call - Daily</title>
  <style>
    html, body, #video-root { margin: 0; width: 100%; height: 100%; background: #fff7ef; }
    body { overflow: hidden; }
    #video-root { position: relative; }
    #video-root > iframe { width: 100% !important; height: 100% !important; border: 0 !important; }
    #boot-message {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fff7ef;
      color: #422f35;
      font: 600 16px/1.4 system-ui, sans-serif;
      text-align: center;
    }
  </style>
  <script crossorigin src="https://unpkg.com/@daily-co/daily-js"></script>
</head>
<body>
  <div id="video-root">
    <div id="boot-message">Preparing Daily…</div>
  </div>
  <script type="module" src="/daily-client.js"></script>
</body>
</html>
