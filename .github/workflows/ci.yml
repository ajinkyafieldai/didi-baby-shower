name: CI

on:
  pull_request:
    branches:
      - devel
  push:
    branches:
      - devel

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: |
          node --check app.js
          node --check host.js
          node --check projector.js
          node --check babyshower.js
          node --check photobooth.js
          node --check scripts/phrase-map.mjs
          node --check daily-client.js
          node --check frontend/event-config.js
          node --check frontend/features.js
          node --check scripts/test-event-package-runtime.mjs
          node --check scripts/verify-dugong-packages.mjs
          node --check scripts/test-event-registry.mjs
          node --check functions/api/events.js
          node --check functions/api/photos.js
          node --check functions/api/video-config.js
          node --check functions/api/video-provision.js
          node --check realtime/src/index.js

      - name: Python syntax check
        run: python3 -m py_compile scripts/local-transcript.py

      - name: Shell syntax check
        run: |
          bash -n scripts/run-local-transcript.sh
          bash -n scripts/list-audio-sources.sh

      - name: Transcript mapper test
        run: node scripts/test-phrase-map.mjs

      - name: Trigger dry-run test
        run: node scripts/test-trigger-dry-run.mjs

      - name: Verify Dugong package provenance
        run: node scripts/verify-dugong-packages.mjs

      - name: Event registry contract
        run: node scripts/test-event-registry.mjs

      - name: Event package runtime proof
        run: node scripts/test-event-package-runtime.mjs

      - name: Pilot call telemetry
        run: |
          node scripts/test-pilot-telemetry.mjs
          node scripts/test-call-pin-restoration.mjs
          node scripts/test-shared-recipes.mjs
          node scripts/test-server-photo-flow.mjs
          node scripts/test-keepsake-export.mjs
          node scripts/test-keepsake-postprocess.mjs
          node scripts/test-shared-family-frontend.mjs
          node scripts/test-family-experience.mjs
      - name: Shared family state contract
        run: node scripts/test-family-state.mjs
      - name: Recording room contract
        run: node scripts/test-recording-room.mjs

      - name: Recording CLI lifecycle
        run: |
          node scripts/test-recording-cli.mjs
          node scripts/test-recording-notes.mjs
          python3 scripts/test-recording-notes-tty.py

      - name: Admin map pin reset
        run: |
          node scripts/test-pin-reset.mjs
          node scripts/test-reset-all.mjs
          node scripts/test-reset-backup.mjs

      - name: Build and verify
        run: npm run build

  photobooth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install photobooth dependencies
        run: python -m pip install -r requirements-photobooth.txt
      - name: Family photo contract and countdown tests
        run: python -m unittest discover -s tests -p 'test*photo*.py'
      - name: Photobooth telemetry persistence
        run: node scripts/test-photobooth-telemetry.mjs
