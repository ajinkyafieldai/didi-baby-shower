name: CI

on:
  pull_request:
    branches:
      - devel
  push:
    branches:
      - devel

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: |
          node --check app.js
          node --check host.js
          node --check projector.js
          node --check babyshower.js
          node --check photobooth.js
          node --check scripts/phrase-map.mjs
          node --check scripts/rtms-transcript.mjs
          node --check scripts/rtms-transcript-sim.mjs
          node --check zoom-client.js
          node --check functions/api/events.js
          node --check functions/api/photos.js
          node --check functions/api/zoom-signature.js
          node --check realtime/src/index.js

      - name: Shell syntax check
        run: |
          bash -n scripts/run-transcript-pipeline.sh
          bash -n scripts/run-transcript-local.sh
          bash -n scripts/install-rtms-service.sh

      - name: Transcript mapper test
        run: node scripts/test-phrase-map.mjs

      - name: Trigger dry-run test
        run: node scripts/test-trigger-dry-run.mjs

      - name: Build and verify
        run: npm run build
