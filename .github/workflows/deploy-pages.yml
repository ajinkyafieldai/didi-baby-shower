name: Deploy family site to Pages

on:
  push:
    branches: [devel]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: didi-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check shared family and PDF export
        run: |
          node scripts/test-pin-reset.mjs
          node scripts/test-family-state.mjs
          node scripts/test-shared-family-frontend.mjs
          node scripts/test-shared-recipes.mjs
          node scripts/test-keepsake-export.mjs
          node scripts/test-server-photo-flow.mjs
          node scripts/test-family-experience.mjs
      - name: Build site and Functions
        run: npm run build
      - name: Resolve the existing Pages production branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !account) throw new Error('Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets. Token needs Cloudflare Pages Edit access.');
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/pages/projects/didi-baby-shower`, {
            headers: { authorization: `Bearer ${token}` }
          });
          const data = await response.json();
          if (!response.ok || !data.success) throw new Error(`Cannot read Pages project (HTTP ${response.status}). Check token account and Cloudflare Pages permission.`);
          const branch = data.result?.production_branch;
          if (!branch || /[\r\n\0]/.test(branch)) throw new Error('Pages project did not return a valid production branch.');
          appendFileSync(process.env.GITHUB_ENV, `DIDI_PAGES_PRODUCTION_BRANCH=${branch}\n`);
          console.log(`Deploying to existing production branch: ${branch}`);
          JS
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: pages deploy dist --project-name=didi-baby-shower --branch=${{ env.DIDI_PAGES_PRODUCTION_BRANCH }}
