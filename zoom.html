<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Baby Shower Zoom</title>
  <style>
    html, body, #zmmtg-root { margin: 0; width: 100%; height: 100%; background: #161215; }
    body { overflow: hidden; }
    #boot-message {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #161215;
      color: white;
      font: 600 16px/1.4 system-ui, sans-serif;
      text-align: center;
    }
  </style>

  <script src="https://source.zoom.us/6.5.0/lib/vendor/react.min.js"></script>
  <script src="https://source.zoom.us/6.5.0/lib/vendor/react-dom.min.js"></script>
  <script src="https://source.zoom.us/6.5.0/lib/vendor/redux.min.js"></script>
  <script src="https://source.zoom.us/6.5.0/lib/vendor/redux-thunk.min.js"></script>
  <script src="https://source.zoom.us/6.5.0/lib/vendor/lodash.min.js"></script>
  <script src="https://source.zoom.us/zoom-meeting-6.5.0.min.js"></script>
</head>
<body>
  <div id="boot-message">Preparing the family video call…</div>

  <script>
    const bootMessage = document.getElementById("boot-message");
    const name = new URLSearchParams(location.search).get("name") || "Guest";

    function report(type, text) {
      parent.postMessage({ type, text }, location.origin);
    }

    async function startZoom() {
      try {
        report("zoom-status", "Preparing Zoom…");

        const response = await fetch("/api/zoom-signature", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: "{}",
          cache: "no-store"
        });

        const config = await response.json();

        if (!response.ok) {
          throw new Error(config.error || "Zoom is not configured.");
        }

        if (!window.ZoomMtg) {
          throw new Error("Zoom Meeting SDK did not load.");
        }

        ZoomMtg.setZoomJSLib("https://source.zoom.us/6.5.0/lib", "/av");
        ZoomMtg.preLoadWasm();
        ZoomMtg.prepareWebSDK();

        report("zoom-status", "Joining Zoom…");

        ZoomMtg.init({
          leaveUrl: location.origin + "/",
          patchJsMedia: true,
          success: function () {
            ZoomMtg.join({
              signature: config.signature,
              sdkKey: config.sdkKey,
              meetingNumber: config.meetingNumber,
              passWord: config.passcode || "",
              userName: name,
              success: function () {
                bootMessage.remove();
                report("zoom-status", "Live");
              },
              error: function (error) {
                console.error(error);
                bootMessage.textContent = "Could not join the Zoom meeting.";
                report("zoom-status", "Could not join Zoom");
              }
            });
          },
          error: function (error) {
            console.error(error);
            bootMessage.textContent = "Could not start Zoom.";
            report("zoom-status", "Could not start Zoom");
          }
        });
      } catch (error) {
        console.error(error);
        bootMessage.textContent = error.message || "Zoom is not configured yet.";
        report("zoom-config-error", bootMessage.textContent);
      }
    }

    startZoom();
  </script>
</body>
</html>
