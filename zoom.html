<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="format-detection" content="telephone=no">
  <title>Baby Shower Zoom</title>
  <style>
    html, body, #zmmtg-root { margin: 0; width: 100%; height: 100%; background: #161215; }
    body { overflow: hidden; }
    #boot-message {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #161215;
      color: white;
      font: 600 16px/1.4 system-ui, sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="boot-message">Preparing the family video call…</div>

  <script>
    window.addEventListener("error", function (event) {
      var el = document.getElementById("boot-message");
      if (el) el.textContent = "Zoom startup error: " + (event.message || "unknown script error");
    });

    window.addEventListener("unhandledrejection", function (event) {
      var el = document.getElementById("boot-message");
      var reason = event.reason && (event.reason.message || String(event.reason));
      if (el) el.textContent = "Zoom startup error: " + (reason || "unhandled promise rejection");
    });
  </script>

  <script src="https://source.zoom.us/6.5.0/lib/vendor/react.min.js"></script>
  <script src="https://source.zoom.us/6.5.0/lib/vendor/react-dom.min.js"></script>
  <script src="https://source.zoom.us/6.5.0/lib/vendor/react-redux.min.js"></script>
  <script src="https://source.zoom.us/6.5.0/lib/vendor/redux.min.js"></script>
  <script src="https://source.zoom.us/6.5.0/lib/vendor/redux-thunk.min.js"></script>
  <script src="https://source.zoom.us/6.5.0/lib/vendor/lodash.min.js"></script>
  <script src="https://source.zoom.us/6.5.0/zoom-meeting-6.5.0.min.js"></script>
  <script src="/zoom-client.js"></script>
</body>
</html>
