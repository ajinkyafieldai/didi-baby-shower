<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7f4">
  <title>Didi's Baby Shower</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="video-stage" aria-label="Baby shower video call">
      <iframe
        id="zoom-frame"
        title="Zoom baby shower call"
        allow="camera; microphone; autoplay; fullscreen"
        referrerpolicy="same-origin"
      ></iframe>

      <div id="video-placeholder" class="video-placeholder">
        <div class="flower-mark" aria-hidden="true">✿</div>
        <h1>Didi's Baby Shower</h1>
        <p>Join the family video call, then use the celebration buttons together.</p>
        <form id="join-form" class="join-form">
          <label for="guest-name">Your name</label>
          <input id="guest-name" name="guestName" autocomplete="name" inputmode="text" placeholder="e.g. Aaji" maxlength="60" required>
          <button class="primary-button" id="join-button" type="submit" disabled>Join</button>
        </form>
        <p class="permission-help">Your browser will ask for permission once. After you allow it, the family video call will open automatically.</p>
        <p id="join-message" class="join-message" role="status" aria-live="polite"></p>
      </div>

      <div id="mark-layer" class="mark-layer" aria-hidden="true"></div>
      <div id="effect-layer" class="effect-layer" aria-hidden="true"></div>
      <div id="event-label" class="event-label" aria-live="polite"></div>

      <div class="call-status">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">Ready to join</span>
      </div>

      <div class="game-actions" aria-label="Baby shower games">
        <button class="game-launch" data-game="names" type="button">
          <span aria-hidden="true">👶</span><span>Baby Names</span>
        </button>
        <button class="game-launch" data-game="didi" type="button">
          <span aria-hidden="true">🏆</span><span>Didi Quiz</span>
        </button>
        <button class="game-launch" data-game="bingo" type="button">
          <span aria-hidden="true">🎯</span><span>Bingo</span>
        </button>
      </div>

      <button class="photo-button" data-effect="photo" type="button" aria-label="Family photo moment">
        <span aria-hidden="true">📸</span>
        <span>Photo</span>
      </button>

      <div id="game-panel" class="game-panel" hidden>
        <div class="game-card" role="dialog" aria-modal="true" aria-labelledby="game-title">
          <button id="game-close" class="game-close" type="button" aria-label="Close game">×</button>
          <div id="game-content"></div>
        </div>
      </div>
    </section>

    <nav class="ritual-dock" aria-label="Baby shower celebrations">
      <button class="ritual-button" data-effect="ovalni" type="button">
        <span class="ritual-icon" aria-hidden="true">🪔</span>
        <span>Ovalni</span>
      </button>
      <button class="ritual-button" data-effect="flowers" type="button">
        <span class="ritual-icon" aria-hidden="true">🌸</span>
        <span>Flowers</span>
      </button>
      <button class="ritual-button" data-effect="ashirwad" type="button">
        <span class="ritual-icon" aria-hidden="true">🙌</span>
        <span>Ashirwad</span>
      </button>
      <button class="ritual-button" data-effect="supari" type="button">
        <span class="ritual-icon" aria-hidden="true">🌰</span>
        <span>Supari</span>
      </button>
      <button class="ritual-button" data-effect="haldi" type="button">
        <span class="ritual-icon" aria-hidden="true">🟡</span>
        <span>Haldi</span>
      </button>
      <button class="ritual-button" data-effect="kunku" type="button">
        <span class="ritual-icon" aria-hidden="true">🔴</span>
        <span>Kunku</span>
      </button>
      <button class="ritual-button" data-effect="oti" type="button">
        <span class="ritual-icon" aria-hidden="true">🥥</span>
        <span>Oti</span>
      </button>
      <button class="ritual-button" data-effect="celebrate" type="button">
        <span class="ritual-icon" aria-hidden="true">🎉</span>
        <span>Celebrate</span>
      </button>
    </nav>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
